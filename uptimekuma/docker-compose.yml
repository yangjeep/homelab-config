version: "3.8"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: always

    volumes:
      - /home/yangjeep/data/uptimekuma:/app/data

    ports:
      - "3001:3001"

    networks:
      # Normal application traffic leaves through the Pi's lab-facing host route.
      # Docker SNAT makes UniFi see the Pi's lab address as the source.
      lab_egress:
        gw_priority: 1
      # Private origin path used only by cloudflared -> Kuma.
      tunnel_link:
        ipv4_address: "172.31.0.10"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-uptimekuma
    restart: always

    command: tunnel run

    environment:
      - TUNNEL_TOKEN=${CFD_TOKEN}

    networks:
      # No LAN egress is available on this link.
      tunnel_link:
      # cloudflared's only external path is the DMZ macvlan.
      dmz_vlan:
        ipv4_address: "10.25.254.211"
        mac_address: "76:16:31:69:e7:9b"
        gw_priority: 1

networks:
  # Application egress. This is intentionally a Docker bridge rather than a
  # macvlan so Kuma can still reach services on the Pi host. Docker SNAT sends
  # traffic out through the Pi's lab interface, so UniFi applies lab-zone policy.
  lab_egress:
    driver: bridge

  # Private transport between cloudflared and the application. No host/LAN egress.
  tunnel_link:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "172.31.0.0/24"
          gateway: "172.31.0.1"

  # Internet egress for cloudflared is forced through the DMZ macvlan.
  dmz_vlan:
    external: true
    name: dmz_vlan
