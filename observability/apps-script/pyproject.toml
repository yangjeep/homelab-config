[project]
name = "homelab-apps-script-observer"
version = "0.1.0"
description = "Bounded Apps Script execution metadata collector"
requires-python = ">=3.12"
dependencies = [
  "httpx2[brotli,http2,zstd]>=2.12,<3",
  "pydantic>=2.11,<3",
]

[project.scripts]
apps-script-observer = "apps_script_observer.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps_script_observer"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "TC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "PLR2004", "S101", "S105", "S106"]
