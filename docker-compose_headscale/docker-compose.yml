version: '3.5'
services:
  headscale:
    image: headscale/headscale:latest
    volumes:
      - ~/homelab-config/docker-compose_headscale/config:/etc/headscale/
      - ~/homelab-config/docker-compose_headscale/data:/var/lib/headscale
    ports:
      - 80:8080
    command: headscale serve
    restart: unless-stopped
