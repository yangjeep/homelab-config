version: "3.8"

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: always

    environment:
      - APP_URL=${BESZEL_APP_URL}

    volumes:
      - /home/yangjeep/data/beszel:/beszel_data
      - /home/yangjeep/data/beszel_socket:/beszel_socket

    ports:
      - "8090:8090"

    networks:
      # Normal application traffic leaves through the Pi's lab-facing host route.
      # Docker SNAT makes UniFi see the Pi's lab address as the source.
      lab_egress:
        gw_priority: 1
      # Private origin path used only by cloudflared -> Beszel.
      tunnel_link:
        ipv4_address: "172.31.1.10"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-beszel
    restart: always

    command: tunnel run

    environment:
      - TUNNEL_TOKEN=${CFD_TOKEN}

    networks:
      # No LAN egress is available on this link.
      tunnel_link:
        ipv4_address: "172.31.1.11"
      # cloudflared's only external path is the DMZ macvlan.
      dmz_vlan:
        ipv4_address: "10.25.254.212"
        mac_address: "06:ec:61:4d:bf:8d"
        gw_priority: 1

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: always

    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY}
      - TOKEN=${BESZEL_AGENT_TOKEN}

    volumes:
      - /home/yangjeep/data/beszel_agent:/var/lib/beszel-agent
      - /home/yangjeep/data/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  # Application egress. This stays a Docker bridge so the hub preserves normal
  # host/LAN reachability; Docker SNAT sends it out through the Pi's lab interface.
  lab_egress:
    driver: bridge

  # Private transport between cloudflared and the Beszel hub. No host/LAN egress.
  tunnel_link:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "172.31.1.0/24"
          gateway: "172.31.1.1"

  # Internet egress for cloudflared is forced through the DMZ macvlan.
  dmz_vlan:
    external: true
    name: dmz_vlan
