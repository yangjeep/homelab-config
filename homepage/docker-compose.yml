version: "3.8"

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: always

    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_PVE_TOKEN=${HOMEPAGE_VAR_PVE_TOKEN}
      - HOMEPAGE_VAR_PAPERLESS_TOKEN=${HOMEPAGE_VAR_PAPERLESS_TOKEN}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_VAR_SONARR_TOKEN}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_VAR_RADARR_TOKEN}
      - HOMEPAGE_VAR_JELLYFIN_TOKEN=${HOMEPAGE_VAR_JELLYFIN_TOKEN}
      - HOMEPAGE_VAR_IMMICH_TOKEN=${HOMEPAGE_VAR_IMMICH_TOKEN}
      - HOMEPAGE_VAR_PLEX_TOKEN=${HOMEPAGE_VAR_PLEX_TOKEN}
      - HOMEPAGE_VAR_UNIFI_API_KEY=${HOMEPAGE_VAR_UNIFI_API_KEY}
      - HOMEPAGE_VAR_UPTIME_KUMA_HOME_SLUG=${HOMEPAGE_VAR_UPTIME_KUMA_HOME_SLUG}
      - HOMEPAGE_VAR_UPTIME_KUMA_REMOTE_SLUG=${HOMEPAGE_VAR_UPTIME_KUMA_REMOTE_SLUG}
      - HOMEPAGE_VAR_BESZEL_USERNAME=${HOMEPAGE_VAR_BESZEL_USERNAME}
      - HOMEPAGE_VAR_BESZEL_PASSWORD=${HOMEPAGE_VAR_BESZEL_PASSWORD}
      - HOMEPAGE_VAR_GITEA_TOKEN=${HOMEPAGE_VAR_GITEA_TOKEN}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${HOMEPAGE_VAR_QBITTORRENT_USERNAME}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_JACKETT_PASSWORD=${HOMEPAGE_VAR_JACKETT_PASSWORD}
      - HOMEPAGE_VAR_TRUENAS_API_KEY=${HOMEPAGE_VAR_TRUENAS_API_KEY}
      - HOMEPAGE_VAR_FRIGATE_USERNAME=${HOMEPAGE_VAR_FRIGATE_USERNAME}
      - HOMEPAGE_VAR_FRIGATE_PASSWORD=${HOMEPAGE_VAR_FRIGATE_PASSWORD}
      - HOMEPAGE_VAR_WALLOS_API_KEY=${HOMEPAGE_VAR_WALLOS_API_KEY}

    volumes:
      - /home/yangjeep/homelab-config/homepage/config/:/app/config

    ports:
      - "3000:3000"

    networks:
      # Normal dashboard/API traffic leaves through the Pi's lab-facing host route.
      # Docker SNAT makes UniFi see the Pi's lab address as the source.
      lab_egress:
        gw_priority: 1
      # Private origin path used only by cloudflared -> Homepage.
      tunnel_link:
        ipv4_address: "172.31.2.10"

    depends_on:
      - dockerproxy

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: homepage-dockerproxy
    restart: always

    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - POST=0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      lab_egress:

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-homepage
    restart: always

    command: tunnel run

    environment:
      - TUNNEL_TOKEN=${CFD_TOKEN}

    networks:
      # No LAN egress is available on this link.
      tunnel_link:
        ipv4_address: "172.31.2.12"
      # cloudflared's only external path is the DMZ macvlan.
      dmz_vlan:
        ipv4_address: "10.25.254.213"
        mac_address: "3a:97:01:67:f7:e7"
        gw_priority: 1

networks:
  # Homepage keeps normal host/LAN/API reachability on a Docker bridge. Docker
  # SNAT sends it out through the Pi's lab interface, so UniFi applies lab policy.
  lab_egress:
    driver: bridge

  # Private transport between cloudflared and Homepage. No host/LAN egress.
  tunnel_link:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "172.31.2.0/24"
          gateway: "172.31.2.1"

  # Internet egress for cloudflared is forced through the DMZ macvlan.
  dmz_vlan:
    external: true
    name: dmz_vlan
