---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Infrastructure:
    - UniFi:
        icon: unifi.png
        href: https://192.168.100.1
        description: Network
        widget:
          type: unifi
          url: https://192.168.253.65
          key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
          fields:
            - uptime
            - wan
            - lan_users
            - wlan_users

    - Proxmox:
        icon: proxmox.png
        href: https://192.168.253.110:8006
        description: EC200a virtualization
        widget:
          type: proxmox
          url: https://192.168.253.110:8006
          username: homepage-readonly@pam!homepage
          password: "{{HOMEPAGE_VAR_PVE_TOKEN}}"
          node: pve-ec200a
          fields:
            - vms
            - lxc
            - resources.cpu
            - resources.mem

    - Grafana:
        icon: grafana.png
        href: http://192.168.253.228:3000/d/homelab-noc/homelab-noc
        description: Homelab metrics and logs
        siteMonitor: http://192.168.253.228:3000/api/health

    - Hermes:
        icon: mdi-robot
        href: https://t.me/yangjeep_clawbot
        description: Private homelab assistant on Telegram

    - Homepage:
        icon: homepage.png
        href: https://home.yangjeep.net
        description: Homelab dashboard
        server: pi
        container: homepage

    - Uptime Kuma Home:
        icon: uptime-kuma.png
        href: https://kuma-home.yangjeep.net/
        description: Home availability monitoring
        server: pi
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: https://kuma-home.yangjeep.net/
          slug: "{{HOMEPAGE_VAR_UPTIME_KUMA_HOME_SLUG}}"

    - Uptime Kuma Remote:
        icon: uptime-kuma.png
        href: https://uptime.yangjeep.net/dashboard
        description: Remote availability monitoring
        widget:
          type: uptimekuma
          url: https://uptime.yangjeep.net
          slug: "{{HOMEPAGE_VAR_UPTIME_KUMA_REMOTE_SLUG}}"

    - Beszel:
        icon: beszel.png
        href: https://beszel.yangjeep.net
        description: System monitoring
        server: pi
        container: beszel
        widget:
          type: beszel
          url: http://beszel.yangjeep.net
          username: "{{HOMEPAGE_VAR_BESZEL_USERNAME}}"
          password: "{{HOMEPAGE_VAR_BESZEL_PASSWORD}}"
          version: 2

- Development:

    - LeaseLab Dev:
        icon: mdi-home-edit
        href: https://YOUR-LEASELAB-DEV
        description: LeaseLab development
        proxmoxNode: pve-ec200a
        proxmoxVMID: 111
        proxmoxType: lxc

    - SmartSewer Dev:
        icon: mdi-pipe
        href: https://YOUR-SMARTSEWER-DEV
        description: SmartSewer development
        proxmoxNode: pve-ec200a
        proxmoxVMID: 112
        proxmoxType: lxc

    - Gitea:
        icon: gitea.png
        href: http://192.168.253.100:30008/
        description: Git hosting
        proxmoxNode: pve-ec200a
        proxmoxVMID: 210
        proxmoxType: lxc
        widget:
          type: gitea
          url: http://192.168.253.100:30008
          key: "{{HOMEPAGE_VAR_GITEA_TOKEN}}"

    - Gitea Mirror:
        icon: gitea.png
        href: http://192.168.253.100:34321/
        description: Git syncing from Github to Gitea
        proxmoxNode: pve-ec200a
        proxmoxVMID: 211
        proxmoxType: lxc

- Media Automation:

    - Radarr:
        siteMonitor: http://192.168.253.100:30025/ping
        icon: radarr.png
        href: http://192.168.253.100:30025
        description: Movies
        widget:
          type: radarr
          url: http://192.168.253.100:30025
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"

    - Sonarr:
        siteMonitor: http://192.168.253.100:30113/ping
        icon: sonarr.png
        href: http://192.168.253.100:30113
        description: TV
        widget:
          type: sonarr
          url: http://192.168.253.100:30113
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"

    - qBittorrent:
        siteMonitor: http://192.168.253.100:30024/
        icon: qbittorrent.png
        href: http://192.168.253.100:30024/
        description: Downloads
        widget:
          type: qbittorrent
          url: http://192.168.253.100:30024
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"

    - Prowlarr:
        siteMonitor: http://192.168.253.100:30050/ping
        icon: prowlarr.png
        href: http://192.168.253.100:30050
        description: Indexers
        widget:
          type: prowlarr
          url: http://192.168.253.100:30050
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

- Storage & Apps:
    - TrueNAS:
        icon: truenas.png
        href: https://192.168.253.100
        description: Primary storage
        widget:
          type: truenas
          url: https://192.168.253.100
          version: 2
          key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
          enablePools: true

    - Frigate:
        icon: frigate.png
        href: https://192.168.253.100:30193/
        description: Camera NVR
        widget:
          type: frigate
          url: https://192.168.253.100:30193
          username: "{{HOMEPAGE_VAR_FRIGATE_USERNAME}}"
          password: "{{HOMEPAGE_VAR_FRIGATE_PASSWORD}}"
          fields:
            - cameras
            - uptime
            - version

    - Immich:
        icon: immich.png
        href: https://immich.yangjeep.net
        description: Photos
        widget:
          type: immich
          url: http://192.168.253.100:30041
          key: "{{HOMEPAGE_VAR_IMMICH_TOKEN}}"
          version: 2
          fields:
            - users
            - photos
            - videos
            - storage

    - Plex:
        siteMonitor: http://192.168.253.100:32400/identity
        icon: plex.png
        href: http://192.168.253.100:32400
        description: Media server
        widget:
          type: plex
          url: http://192.168.253.100:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"

    - Jellyfin:
        siteMonitor: http://192.168.253.100:30013/health
        icon: jellyfin.png
        href: http://192.168.253.100:30013/
        description: Media server
        widget:
          type: jellyfin
          url: http://192.168.253.100:30013
          key: "{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true

    - Paperless:
        icon: paperless-ngx.png
        href: http://192.168.253.100:30070
        description: Document management
        widget:
          type: paperlessngx
          url: http://192.168.253.100:30070
          key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"

- Utilities:

    - Wallos:
        icon: wallos.png
        href: https://192.168.253.219
        description: Subscriptions
        proxmoxNode: pve-ec200a
        proxmoxVMID: 401
        proxmoxType: lxc
        widget:
          type: wallos
          url: http://192.168.253.219
          key: "{{HOMEPAGE_VAR_WALLOS_API_KEY}}"
